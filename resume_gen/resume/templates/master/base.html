<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume | Maker{% endblock %}</title>

  <!-- Updated to Bootstrap 5.3.3 for better stability -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <style>
    :root {
      --bg-main   : #0a0a0a;
      --bg-card   : #111111;
      --bg-input  : #1a1a1a;
      --border    : #222222;
      --red       : #e63946;
      --red-hover : #c1121f;
      --text      : #ffffff;
      --muted     : #9ca3af;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    /* Professional Card Styling */
    .dark-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Form Overrides */
    .form-control {
      background-color: var(--bg-input) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      padding: 0.75rem 1rem;
    }
    .form-control:focus {
      border-color: var(--red) !important;
      box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2) !important;
    }

    /* Button Styling */
    .btn-red {
      background-color: var(--red);
      color: #fff;
      border: none;
      transition: all 0.3s ease;
    }
    .btn-red:hover { background-color: var(--red-hover); color: #fff; transform: translateY(-1px); }

    .btn-outline-red {
      border: 1px solid var(--red);
      color: var(--red);
      background: transparent;
    }
    .btn-outline-red:hover { background: var(--red); color: #fff; }

    /* Alert Styling */
    .alert { border-radius: 8px; border: 1px solid transparent; }
    .alert-success { background: #0f2a1a; color: #4ade80; border-color: #1a4a2a; }
    .alert-danger  { background: #2a0a0a; color: #f87171; border-color: #4a1a1a; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

  {% include "master/navbar.html" %}

  <div class="container mt-3">
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
      <i class="bi bi-info-circle me-2"></i> {{ msg }}
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
